<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# block title: area yang diisi template anak #}
  <title>{% block title %}Toko Kampus{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- ================= NAVBAR (ditulis sekali di sini) ================= -->
  <nav class="navbar navbar-expand navbar-dark bg-danger px-3">
    <a class="navbar-brand fw-bold" href="{{ url_for('beranda') }}">Toko Kampus</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('beranda') }}">Beranda</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('tentang') }}">Tentang</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('produk') }}">Produk</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('kontak') }}">Kontak</a>
      </li>
    </ul>
    <a class="btn btn-outline-light btn-sm" href="{{ url_for('cek_query', u='andi') }}">Cek Username</a>
  </nav>

  <!-- ================= KONTEN (diisi template anak) ================= -->
  <main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="text-center text-muted py-3 border-top">
    &copy; 2025 Toko Kampus &middot; Tugas Individu 5 &mdash; Routing &amp; Template di Flask
  </footer>

</body>
</html>
